<title>RYXX Expansietracker</title>

<style>body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#2e6047;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center}a{display:inline-block;margin-top:16px;background:#e9531d;color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:12px}</style>
</head>
<body>
<div><h1 style="font-size:22px;margin:0 0 6px">RYXX Expansietracker</h1><p style="margin:0;opacity:.8">Deze versie is niet meer beschikbaar.</p><a href="https://claude.ai/artifact/X4ouM5KaTUt8ZXThuRBQHj">Open de Expansietracker</a></div>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
</script>
</body>
